<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13151d">
<title>リング開催予告メーカー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: 1 column on phones — preview on top, 2 inputs, 3 save buttons. Quiet dark UI, gold only on the primary action. */
:root{
  --bg:#13151d; --panel:#1b1f2c; --line:#2c3247; --fg:#ece6d8; --muted:#8e93a6; --gold:#c9a45c; --gold-ink:#1d1708;
  color-scheme:dark;
  --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.04em}
.preview{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center}
canvas#cv{width:100%;max-width:300px;aspect-ratio:9/16;height:auto;border-radius:6px;background:#0c0e14}
.guide{font-size:12px;color:var(--muted);text-align:center;margin-top:-6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input[type=time]{width:100%;font:inherit;font-size:30px;font-weight:700;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#10131b;color:var(--fg)}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px;align-items:stretch}
.stepper button{font:inherit;font-size:28px;font-weight:700;border:1px solid var(--line);background:#10131b;color:var(--fg);border-radius:10px;cursor:pointer;min-height:56px}
.stepper output{display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;background:#10131b;border:1px solid var(--line);border-radius:10px}
.stepper output small{font-size:15px;margin-left:6px;color:var(--muted);font-weight:500}
input[type=range]{width:100%;accent-color:var(--gold)}
.btns{display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-size:16px;font-weight:700;padding:14px;border-radius:10px;border:1px solid var(--line);background:#10131b;color:var(--fg);cursor:pointer}
.btn.main{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn:focus-visible,.stepper button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
/* 押した感: 押している間だけ沈み、影が縮む。離すと戻る */
.btn,.stepper button,.tab{-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .08s ease-out,box-shadow .08s ease-out,background-color .2s,color .2s,border-color .2s}
.btn{box-shadow:0 4px 0 #05060a}
.btn.main{box-shadow:0 4px 0 #8a6d33}
.stepper button{box-shadow:0 3px 0 #05060a}
.tab{box-shadow:0 3px 0 #05060a}
.btn:active,.stepper button:active,.tab:active{transform:translateY(3px);box-shadow:0 1px 0 #05060a}
.btn.main:active{box-shadow:0 1px 0 #8a6d33}
.btn.done{background:#e8dcc0;color:var(--gold-ink);border-color:#e8dcc0}
@media (prefers-reduced-motion:reduce){.btn,.stepper button,.tab{transition:none}}
.msg{font-size:13px;color:var(--muted);min-height:1.4em}
.file{display:flex;flex-direction:column;gap:6px}
.file input{font:inherit;font-size:13px;color:var(--muted)}
.saved{display:none;flex-direction:column;gap:8px;align-items:center}
.saved.on{display:flex}
.saved img{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{font:inherit;font-size:15px;font-weight:700;padding:12px;border-radius:10px;border:1px solid var(--line);background:#10131b;color:var(--muted);cursor:pointer}.tab.on{color:var(--fg);border-color:var(--gold)}.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}.note{font-size:12px;color:var(--muted)}
</style>

</head>
<body>
<div class="wrap">
  <h1>リング開催予告メーカー</h1>

  <div class="tabs" role="tablist">
    <button class="tab on" id="tabS" role="tab" aria-selected="true">ストーリー 9:16</button>
    <button class="tab" id="tabX" role="tab" aria-selected="false">X 4:5</button>
  </div>
  <div class="preview"><canvas id="cv" width="1080" height="1920"></canvas></div>
  <div class="guide" id="guide">ストーリー用（1080×1920）のプレビューです</div>

  <div class="card">
    <div>
      <label for="time">本日の開始予定時間</label>
      <input id="time" type="time" value="19:00">
    </div>
    <div>
      <label>現在のご予約人数</label>
      <div class="stepper">
        <button id="minus" aria-label="1人減らす">−</button>
        <output id="count">3<small>名様</small></output>
        <button id="plus" aria-label="1人増やす">＋</button>
      </div>
    </div>
    <div>
      <label for="ypos">文字の上下位置（表示中のサイズ用）</label>
      <input id="ypos" type="range" min="500" max="1500" value="965">
    </div>
  </div>

  <div class="card">
    <div class="file">
      <label for="bgS">ストーリー用の背景画像（9:16）</label>
      <input id="bgS" type="file" accept="image/*">
    </div>
    <div class="file">
      <label for="bgX">X用の背景画像（4:5）。未選択ならストーリー用の中央を切り出します</label>
      <input id="bgX" type="file" accept="image/*">
    </div>
    <div class="note">一度選べば端末に記憶されます。</div>
  </div>

  <div class="btns">
    <button class="btn main" id="saveStory">ストーリー用を保存（1080×1920）</button>
    <button class="btn main" id="saveX">X用を保存（4:5・1080×1350）</button>
    <button class="btn" id="copy">投稿文をコピー</button>
    <div class="msg" id="msg" role="status"></div>
  </div>

  <div class="saved" id="saved">
    <div class="msg">保存画面が出ないときは、下の画像を長押しして保存してください。</div>
    <img id="savedImg" alt="書き出した画像">
  </div>
</div>

<script>
(function(){
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var $=function(id){return document.getElementById(id)};
  var mode='s', count=3, bg={s:null,x:null}, ypos={s:965,x:660};
  var RANGE={s:[500,1500],x:[350,1000]}, H={s:1920,x:1350};
  var FONT='"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  var GOLD='#d9bd82', IVORY='#f3ecdc';

  try{ var n=parseInt(localStorage.getItem('rm_count'),10); if(!isNaN(n)) count=n; var t=localStorage.getItem('rm_time'); if(t) $('time').value=t;
       var a=parseInt(localStorage.getItem('rm_y3'),10); if(!isNaN(a)) ypos.s=a; var b=parseInt(localStorage.getItem('rm_yx'),10); if(!isNaN(b)) ypos.x=b; }catch(e){}
  try{ var d=localStorage.getItem('rm_bg'); if(d) loadSrc('s',d); var e2=localStorage.getItem('rm_bg_x'); if(e2) loadSrc('x',e2); }catch(e){}

  function loadSrc(m,src){ var im=new Image(); im.onload=function(){bg[m]=im;draw();}; im.src=src; }
  function timeText(){ return $('time').value||'19:00'; }
  function timeFull(){ return timeText(); }
  function setMsg(s){ $('msg').textContent=s; }

  // 押したあと、ボタンの文字を一時的に「✓ ○○しました」に変えて完了を知らせる
  function flash(btn,text){
    if(!btn) return;
    if(btn._t){ clearTimeout(btn._t); } else { btn._label=btn.textContent; }
    btn.textContent='✓ '+text; btn.classList.add('done');
    btn._t=setTimeout(function(){ btn.textContent=btn._label; btn.classList.remove('done'); btn._t=null; },2000);
  }

  function ensureFonts(){
    if(!document.fonts||!document.fonts.load) return Promise.resolve();
    var s='本日はからリングゲームスタートします。名様ご予約いただいてます。お待ちしております0123456789:';
    return Promise.all([document.fonts.load('500 40px "Zen Kaku Gothic New"',s),document.fonts.load('700 40px "Zen Kaku Gothic New"',s),document.fonts.load('900 40px "Zen Kaku Gothic New"',s),document.fonts.load('700 40px "Cinzel"','RING GAME')]).catch(function(){});
  }

  function cover(c,im,h){
    var r=Math.max(1080/im.width,h/im.height), w=im.width*r, hh=im.height*r;
    c.drawImage(im,(1080-w)/2,(h-hh)/2,w,hh);
  }

  function drawBase(c,m){
    var h=H[m];
    if(bg[m]){ cover(c,bg[m],h); }
    else if(m==='x'&&bg.s){ c.save(); c.translate(0,-285); cover(c,bg.s,1920); c.restore(); }
    else{
      var g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,'#1a1d2b'); g.addColorStop(1,'#10121a');
      c.fillStyle=g; c.fillRect(0,0,1080,h);
      c.fillStyle='#8e93a6'; c.font='500 40px '+FONT; c.textAlign='center'; c.textBaseline='alphabetic';
      c.fillText('背景画像を選んでください',540,h*0.2);
    }
  }

  function line(c,txt,y,size,weight,color){
    c.font=weight+' '+size+'px '+FONT; c.fillStyle=color; c.textAlign='center'; c.textBaseline='alphabetic';
    c.shadowColor='rgba(0,0,0,.45)'; c.shadowBlur=14; c.shadowOffsetY=3;
    c.fillText(txt,540,y); c.shadowColor='transparent'; c.shadowBlur=0; c.shadowOffsetY=0;
  }

  // 「3」+「名様」のように、大きい数字と小さい単位を1行にまとめて中央に置く
  function pair(c,big,small,y,bigSize,smallSize,color1,color2){
    c.textBaseline='alphabetic';
    c.font='900 '+bigSize+'px '+FONT; var w1=c.measureText(big).width;
    c.font='700 '+smallSize+'px '+FONT; var w2=c.measureText(small).width;
    var gap=14, x=540-(w1+gap+w2)/2;
    c.shadowColor='rgba(0,0,0,.45)'; c.shadowBlur=14; c.shadowOffsetY=3; c.textAlign='left';
    c.font='900 '+bigSize+'px '+FONT; c.fillStyle=color1; c.fillText(big,x,y);
    c.font='700 '+smallSize+'px '+FONT; c.fillStyle=color2; c.fillText(small,x+w1+gap,y);
    c.shadowColor='transparent'; c.shadowBlur=0; c.shadowOffsetY=0;
  }

  // 字間をあけて中央に描く(見出し用)
  function spaced(c,txt,y,size,color,sp){
    c.font='700 '+size+'px "Cinzel",serif'; c.fillStyle=color; c.textAlign='left'; c.textBaseline='alphabetic';
    var w=0,i,ws=[]; for(i=0;i<txt.length;i++){ws.push(c.measureText(txt[i]).width); w+=ws[i]+(i<txt.length-1?sp:0);}
    var x=540-w/2; c.shadowColor='rgba(0,0,0,.45)'; c.shadowBlur=12; c.shadowOffsetY=3;
    for(i=0;i<txt.length;i++){c.fillText(txt[i],x,y); x+=ws[i]+sp;}
    c.shadowColor='transparent'; c.shadowBlur=0; c.shadowOffsetY=0;
  }

  function drawText(c,m){
    var cy=ypos[m];                        // 文字ブロック全体の中心
    var top=cy-345;
    spaced(c,'RING GAME',top+20,64,GOLD,14);
    c.fillStyle='rgba(217,189,130,.55)'; c.fillRect(440,top+58,200,2);
    line(c,'本日は',top+155,58,700,IVORY);
    line(c,timeText(),top+355,230,900,GOLD);
    try{ c.letterSpacing='-3px'; }catch(e){}
    line(c,'からリングゲームスタートします。',top+435,48,500,IVORY);
    c.fillStyle='rgba(217,189,130,.55)'; c.fillRect(340,top+490,400,3);
    if(count>0){
      pair(c,String(count),'名様',top+660,190,80,GOLD,GOLD);
      line(c,'ご予約いただいてます。',top+750,48,500,IVORY);
    }else{
      line(c,'ご予約を',top+610,56,500,IVORY);
      line(c,'お待ちしております。',top+690,56,500,IVORY);
    }
    try{ c.letterSpacing='0px'; }catch(e){}
  }

  var seq=0;
  function draw(){
    var my=++seq;
    ensureFonts().then(function(){
      if(my!==seq) return;
      if(cv.height!==H[mode]){ cv.height=H[mode]; }
      cv.style.aspectRatio='1080 / '+H[mode];
      ctx.clearRect(0,0,1080,H[mode]);
      drawBase(ctx,mode); drawText(ctx,mode);
    });
  }

  function exportBlob(m){
    return ensureFonts().then(function(){
      var c=document.createElement('canvas'); c.width=1080; c.height=H[m];
      var x=c.getContext('2d');
      drawBase(x,m); drawText(x,m);
      return new Promise(function(res){ c.toBlob(res,'image/png'); });
    });
  }

  function save(m,btn){
    setMsg('画像を作っています…');
    exportBlob(m).then(function(blob){
      if(!blob){ setMsg('画像を作れませんでした。もう一度お試しください。'); return; }
      showFallback(blob);
      var name='ring-'+(m==='x'?'4x5':'story')+'.png';
      try{ var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); flash(btn,'保存しました'); setMsg('保存しました。保存されないときは、下の画像を長押しして保存してください。'); }catch(e){ setMsg('下の画像を長押しして保存してください。'); }
    });
  }

  function showFallback(blob){
    try{ var u=URL.createObjectURL(blob); $('savedImg').src=u; $('saved').classList.add('on'); }catch(e){}
  }

  function postText(){
    var s='本日は'+timeFull()+'からリングゲームスタートします▶️\n';
    s+= count>0 ? count+'名様ご予約いただいてます！' : 'ご予約お待ちしております！';
    return s;
  }

  function persist(){ try{ localStorage.setItem('rm_count',String(count)); localStorage.setItem('rm_time',$('time').value); localStorage.setItem('rm_y3',String(ypos.s)); localStorage.setItem('rm_yx',String(ypos.x)); }catch(e){} }
  function refreshCount(){ $('count').innerHTML=count+'<small>名様</small>'; }

  function setMode(m){
    mode=m;
    $('tabS').classList.toggle('on',m==='s'); $('tabX').classList.toggle('on',m==='x');
    $('tabS').setAttribute('aria-selected',m==='s'); $('tabX').setAttribute('aria-selected',m==='x');
    var r=$('ypos'); r.min=RANGE[m][0]; r.max=RANGE[m][1]; r.value=ypos[m];
    $('guide').textContent= m==='s' ? 'ストーリー用（1080×1920）のプレビューです' : 'X用（4:5・1080×1350）のプレビューです';
    draw();
  }

  $('tabS').onclick=function(){ setMode('s'); };
  $('tabX').onclick=function(){ setMode('x'); };
  $('plus').onclick=function(){ count=Math.min(30,count+1); refreshCount(); persist(); draw(); };
  $('minus').onclick=function(){ count=Math.max(0,count-1); refreshCount(); persist(); draw(); };
  $('time').addEventListener('input',function(){ persist(); draw(); });
  $('ypos').addEventListener('input',function(){ ypos[mode]=+$('ypos').value; persist(); draw(); });
  $('saveStory').onclick=function(){ save('s',this); };
  $('saveX').onclick=function(){ save('x',this); };
  $('copy').onclick=function(){
    var t=postText();
    var done=function(){ flash($('copy'),'コピーしました'); setMsg('投稿文をコピーしました。'); };
    var fail=function(){ setMsg('コピーできませんでした。\n'+t); };
    try{ navigator.clipboard.writeText(t).then(done,fail); }catch(e){ fail(); }
  };

  function bindBg(id,m,key){
    $(id).addEventListener('change',function(ev){
      var f=ev.target.files&&ev.target.files[0]; if(!f) return;
      var fr=new FileReader();
      fr.onload=function(){
        var im=new Image();
        im.onload=function(){
          // 端末に記憶するため、1080幅のJPEGに縮小して保存
          var c=document.createElement('canvas'); var r=Math.min(1,1080/im.width);
          c.width=Math.round(im.width*r); c.height=Math.round(im.height*r);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          try{ localStorage.setItem(key,c.toDataURL('image/jpeg',0.9)); }catch(e){}
          bg[m]=im; draw(); setMsg('背景画像を設定しました。');
        };
        im.src=fr.result;
      };
      fr.readAsDataURL(f);
    });
  }
  bindBg('bgS','s','rm_bg'); bindBg('bgX','x','rm_bg_x');

  refreshCount(); setMode('s');
})();
</script>
</body>
</html>
